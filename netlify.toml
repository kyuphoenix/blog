[build]
  command = "node scripts/build-netlify.mjs"
  publish = "public"

[[edge_functions]]
  path = "/*"
  function = "server"
  excludedPath = [
    "/css/*",
    "/favicon.ico",
    "/favicon.svg",
    "/favicon-*.png",
    "/apple-touch-icon.png",
    "/web-app-manifest-*.png",
    "/_headers"
  ]
