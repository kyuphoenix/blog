name: Deploy to Netlify

# 仅允许手动运行触发部署
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: '指定部署的 Netlify 站点 ID (可选，留空则自动复用现有站点)'
        required: false
        type: string
      database_type:
        description: '选择部署连接的数据库类型 (auto: 自动检测, supabase: Supabase, none: 关闭统计)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - supabase
          - none
      payload:
        description: 'Pages CMS 上下文 Payload'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Netlify
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 解析 Pages CMS 传入的上下文 Payload 与字段输入
      - name: Parse Pages CMS payload inputs
        run: |
          node -e '
            const fs = require("fs");
            let dbType = process.env.INPUT_DATABASE_TYPE;
            let siteId = process.env.INPUT_SITE_ID;
            if (process.env.INPUT_PAYLOAD) {
              try {
                const payload = JSON.parse(process.env.INPUT_PAYLOAD);
                if (payload?.inputs?.database_type) {
                  dbType = payload.inputs.database_type;
                }
                if (payload?.inputs?.site_id) {
                  siteId = payload.inputs.site_id;
                }
              } catch (e) {
                console.warn("Could not parse Pages CMS payload:", e.message);
              }
            }
            if (dbType) {
              fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_TYPE=${dbType}\n`);
            }
            if (siteId) {
              fs.appendFileSync(process.env.GITHUB_ENV, `NETLIFY_SITE_ID=${siteId}\n`);
            }
          '
        env:
          INPUT_DATABASE_TYPE: ${{ github.event.inputs.database_type }}
          INPUT_SITE_ID: ${{ github.event.inputs.site_id }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Netlify assets and edge functions
        run: pnpm build:netlify

      # 若使用 Supabase，自动检测数据库状态；未初始化且配置了凭证时自动执行建表
      - name: Check and initialize Supabase database
        env:
          DATABASE_TYPE: ${{ env.DATABASE_TYPE || github.event.inputs.database_type || vars.DATABASE_TYPE || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || vars.DATABASE_URL || vars.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        run: pnpm init:supabase

      # 自动同步环境变量并调用 Netlify CLI 执行构建并发布
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN || secrets.NETLIFY_API_KEY }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID || github.event.inputs.site_id || secrets.NETLIFY_SITE_ID || vars.NETLIFY_SITE_ID }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || vars.SITE_NAME || '' }}
          DATABASE_TYPE: ${{ env.DATABASE_TYPE || github.event.inputs.database_type || vars.DATABASE_TYPE || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          UMAMI_HOST: ${{ vars.UMAMI_HOST || secrets.UMAMI_HOST }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID || secrets.UMAMI_WEBSITE_ID }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY || vars.UMAMI_API_KEY }}
          BLOG_URL: ${{ vars.BLOG_URL || secrets.BLOG_URL }}
          GH_OWNER: ${{ vars.GH_OWNER || vars.GITHUB_OWNER || github.repository_owner }}
          GH_REPO: ${{ vars.GH_REPO || vars.GITHUB_REPO || github.event.repository.name }}
          GH_BRANCH: ${{ vars.GH_BRANCH || vars.GITHUB_BRANCH || github.ref_name }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || vars.DATABASE_URL || vars.SUPABASE_DB_URL }}
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm deploy:netlify
