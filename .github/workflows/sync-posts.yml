name: Sync Posts & Refresh Cache

# 当文章目录有变动或推送时触发
on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'friends.json'
      - 'blog.config.json'
  workflow_dispatch:

concurrency:
  group: sync-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    name: Sync Posts & Re-cache
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update post manifest
        run: node scripts/gen-manifest.mjs

      - name: Commit & push manifest if updated
        run: |
          if ! git diff --quiet posts/manifest.json; then
            echo "检测到 manifest.json 发生变动，自动提交最新文章清单..."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add posts/manifest.json
            git commit -m "chore: auto-update posts/manifest.json [skip ci]"
            git push
          else
            echo "manifest.json 已是最新，无需提交。"
          fi

      - name: Notify Cloudflare Worker to re-cache posts & friends
        run: |
          # 获取博客访问地址
          BLOG_URL="${{ vars.BLOG_URL || secrets.BLOG_URL }}"
          PURGE_SECRET="${{ secrets.PURGE_SECRET || secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}"

          if [ -z "$BLOG_URL" ]; then
            echo "⚠️ 未配置 BLOG_URL，跳过 Worker 缓存刷新通知。"
            echo "提示：请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中设置变量 BLOG_URL (如: https://blog.yourname.workers.dev 或 https://blog.example.com)"
            exit 0
          fi

          echo "正在通知 Cloudflare Worker 重新加载文章与友链缓存: ${BLOG_URL%/}/api/posts/purge"
          HTTP_CODE=$(curl -s -o /tmp/purge_res.json -w "%{http_code}" -X POST "${BLOG_URL%/}/api/posts/purge" \
            -H "X-Purge-Secret: ${PURGE_SECRET}")

          echo "HTTP 状态码: $HTTP_CODE"
          if [ -f /tmp/purge_res.json ]; then
            echo "响应内容: $(cat /tmp/purge_res.json)"
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Cloudflare Worker 已成功清空旧缓存并重新缓存最新文章列表与友链！"
          else
            echo "⚠️ 缓存刷新请求返回非 2xx 状态码: $HTTP_CODE (请核对 PURGE_SECRET 与 Worker 状态)"
          fi
