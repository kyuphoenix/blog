name: Deploy to Cloudflare Workers

# 仅允许手动运行触发部署
on:
  workflow_dispatch:
    inputs:
      database_type:
        description: '选择部署连接的数据库类型 (auto: 自动检测, d1: Cloudflare D1, supabase: Supabase, none: 不使用数据库/关闭统计)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - d1
          - supabase
          - none
      payload:
        description: 'Pages CMS 上下文 Payload'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 解析 Pages CMS 传入的上下文 Payload 与字段输入
      - name: Parse Pages CMS payload inputs
        run: |
          node -e '
            const fs = require("fs");
            let dbType = process.env.INPUT_DATABASE_TYPE;
            if (process.env.INPUT_PAYLOAD) {
              try {
                const payload = JSON.parse(process.env.INPUT_PAYLOAD);
                if (payload?.inputs?.database_type) {
                  dbType = payload.inputs.database_type;
                }
              } catch (e) {
                console.warn("Could not parse Pages CMS payload:", e.message);
              }
            }
            if (dbType) {
              fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_TYPE=${dbType}\n`);
            }
          '
        env:
          INPUT_DATABASE_TYPE: ${{ github.event.inputs.database_type }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate post manifest
        run: pnpm gen:manifest

      - name: Build client assets (Swup & Tailwind CSS)
        run: |
          pnpm build:js
          pnpm build:css

      # 注入 Cloudflare 基础设施与有效环境变量（未配置的可选变量如 BLOG_URL 将由脚本自动忽略）
      - name: Prepare wrangler.jsonc infrastructure config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_TYPE: ${{ env.DATABASE_TYPE || github.event.inputs.database_type || vars.DATABASE_TYPE || 'auto' }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID || vars.CLOUDFLARE_KV_ID || vars.KV_NAMESPACE_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID || vars.CLOUDFLARE_D1_ID || vars.D1_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'honoki' }}
          BLOG_URL: ${{ vars.BLOG_URL || secrets.BLOG_URL }}
          GH_OWNER: ${{ vars.GH_OWNER || vars.GITHUB_OWNER || github.repository_owner }}
          GH_REPO: ${{ vars.GH_REPO || vars.GITHUB_REPO || github.event.repository.name }}
          GH_BRANCH: ${{ vars.GH_BRANCH || vars.GITHUB_BRANCH || github.ref_name }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
        run: pnpm prepare:wrangler

      # 若使用 Supabase，自动检测数据库状态；未初始化且配置了凭证时自动执行建表
      - name: Check and initialize Supabase database
        env:
          DATABASE_TYPE: ${{ env.DATABASE_TYPE || github.event.inputs.database_type || vars.DATABASE_TYPE || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || vars.DATABASE_URL || vars.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || vars.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID || vars.CLOUDFLARE_D1_ID || vars.D1_DATABASE_ID }}
        run: pnpm init:supabase

      # 部署到 Cloudflare Workers（所有非敏感有效变量已由 prepare-wrangler 动态写入 wrangler.jsonc，缺失项自动安全跳过）
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      # 将敏感凭据（PURGE_SECRET、SUPABASE_KEY 等）作为加密 Secret 同步到 Cloudflare Worker
      - name: Sync Cloudflare Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'honoki' }}
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || vars.DATABASE_URL || vars.SUPABASE_DB_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm sync:cf-secrets
