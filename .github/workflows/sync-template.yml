name: Sync Template Updates

# 仅允许手动在 Actions 页面按需触发
on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: '同步方式 (direct: 无冲突时直接合并推送到当前分支; pr: 创建 Pull Request 分支供审核)'
        required: false
        default: 'direct'
        type: choice
        options:
          - direct
          - pr
      template_repo:
        description: '上游 Template 模板仓库 (owner/repo)'
        required: false
        default: 'kyuphoenix/honoki'
        type: string
      template_branch:
        description: '上游 Template 模板分支'
        required: false
        default: 'main'
        type: string
      protected_dirs:
        description: '同步时排除并保护的本地目录（空格分隔，默认排除 posts 与 public/images）'
        required: false
        default: 'posts public/images'
        type: string
      payload:
        description: 'Pages CMS 上下文 Payload'
        required: false
        type: string

concurrency:
  group: sync-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Template Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # 解析 Pages CMS 传入的上下文 Payload 与字段输入
      - name: Parse Pages CMS payload inputs
        run: |
          node -e '
            const fs = require("fs");
            let syncMode = process.env.INPUT_SYNC_MODE;
            let repo = process.env.INPUT_TEMPLATE_REPO;
            let branch = process.env.INPUT_TEMPLATE_BRANCH;
            let protectedDirs = process.env.INPUT_PROTECTED_DIRS;
            if (process.env.INPUT_PAYLOAD) {
              try {
                const payload = JSON.parse(process.env.INPUT_PAYLOAD);
                if (payload?.inputs?.sync_mode) syncMode = payload.inputs.sync_mode;
                if (payload?.inputs?.template_repo) repo = payload.inputs.template_repo;
                if (payload?.inputs?.template_branch) branch = payload.inputs.template_branch;
                if (payload?.inputs?.protected_dirs) protectedDirs = payload.inputs.protected_dirs;
              } catch (e) {
                console.warn("Could not parse Pages CMS payload:", e.message);
              }
            }
            if (syncMode) fs.appendFileSync(process.env.GITHUB_ENV, `SYNC_MODE=${syncMode}\n`);
            if (repo) fs.appendFileSync(process.env.GITHUB_ENV, `UPSTREAM_REPO=${repo}\n`);
            if (branch) fs.appendFileSync(process.env.GITHUB_ENV, `UPSTREAM_BRANCH=${branch}\n`);
            if (protectedDirs) fs.appendFileSync(process.env.GITHUB_ENV, `PROTECTED_DIRS=${protectedDirs}\n`);
          '
        env:
          INPUT_SYNC_MODE: ${{ github.event.inputs.sync_mode }}
          INPUT_TEMPLATE_REPO: ${{ github.event.inputs.template_repo }}
          INPUT_TEMPLATE_BRANCH: ${{ github.event.inputs.template_branch }}
          INPUT_PROTECTED_DIRS: ${{ github.event.inputs.protected_dirs }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}

      - name: Sync from upstream template
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO || github.event.inputs.template_repo || vars.TEMPLATE_REPO || 'kyuphoenix/honoki' }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH || github.event.inputs.template_branch || vars.TEMPLATE_BRANCH || 'main' }}
          PROTECTED_DIRS: ${{ env.PROTECTED_DIRS || github.event.inputs.protected_dirs || vars.PROTECTED_DIRS || 'posts public/images' }}
          SYNC_MODE: ${{ env.SYNC_MODE || github.event.inputs.sync_mode || 'direct' }}
        run: |
          set -e

          CURRENT_REPO="${{ github.repository }}"
          
          # 精准获取当前目标分支名称
          CURRENT_BRANCH="${{ github.ref_name }}"
          if [ -z "$CURRENT_BRANCH" ] || [ "$CURRENT_BRANCH" = "HEAD" ]; then
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          fi
          if [ -z "$CURRENT_BRANCH" ] || [ "$CURRENT_BRANCH" = "HEAD" ]; then
            CURRENT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@')
          fi
          if [ -z "$CURRENT_BRANCH" ]; then
            CURRENT_BRANCH="main"
          fi

          echo "=========================================================="
          echo "🔄 开始模板仓库同步"
          echo "📌 当前仓库: $CURRENT_REPO (目标分支: $CURRENT_BRANCH)"
          echo "📌 上游模板: $UPSTREAM_REPO (上游分支: $UPSTREAM_BRANCH)"
          echo "📌 同步模式: $SYNC_MODE"
          echo "📌 保护目录: $PROTECTED_DIRS"
          echo "=========================================================="

          # 0. 若在模板仓库本身运行，直接退出
          if [ "$CURRENT_REPO" = "$UPSTREAM_REPO" ]; then
            echo "ℹ️ 当前仓库即为上游 Template 模板仓库 ($UPSTREAM_REPO)，无需同步。"
            exit 0
          fi

          # 1. 配置 Git 提交身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. 添加上游模板远程并拉取最新提交
          if git remote | grep -q "^template$"; then
            git remote set-url template "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add template "https://github.com/${UPSTREAM_REPO}.git"
          fi

          echo "📥 正在拉取上游模板分支 $UPSTREAM_BRANCH..."
          git fetch template "$UPSTREAM_BRANCH"

          # 3. 检查是否有共同祖先（针对 GitHub Template 初始化无历史的情况进行祖先关联）
          MERGE_BASE=$(git merge-base HEAD "template/$UPSTREAM_BRANCH" 2>/dev/null || true)

          if [ -z "$MERGE_BASE" ]; then
            echo "🔍 检测到通过 GitHub Template 独立初始化的仓库（无共同提交历史）。"
            echo "🧩 正在通过根 Tree SHA 匹配建立精准的 Git 历史锚点..."

            ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            ROOT_TREE=$(git rev-parse "${ROOT_COMMIT}^{tree}" 2>/dev/null || true)
            echo "   当前仓库初始 Commit: $ROOT_COMMIT"
            echo "   当前仓库初始 Tree: $ROOT_TREE"

            MATCHING_COMMIT=""
            while read -r commit tree; do
              if [ "$tree" = "$ROOT_TREE" ]; then
                MATCHING_COMMIT="$commit"
                break
              fi
            done < <(git log "template/$UPSTREAM_BRANCH" --format="%H %T")

            if [ -n "$MATCHING_COMMIT" ]; then
              echo "   ✓ 成功匹配到模板对应的原始 Commit: $MATCHING_COMMIT"
            else
              MATCHING_COMMIT=$(git rev-list --max-parents=0 "template/$UPSTREAM_BRANCH" | tail -n 1)
              echo "   ⚠️ 未找到完全相同的 Tree，回退连接至模板根 Commit: $MATCHING_COMMIT"
            fi

            git replace --graft "$ROOT_COMMIT" "$MATCHING_COMMIT"
            echo "   ✓ 已成功建立历史谱系，后续合并将进行标准三方比对！"
          fi

          # 4. 检查是否有新提交需要合并
          UPSTREAM_HEAD=$(git rev-parse "template/$UPSTREAM_BRANCH")
          CURRENT_MERGE_BASE=$(git merge-base HEAD "$UPSTREAM_HEAD" 2>/dev/null || true)

          if [ "$CURRENT_MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "🎉 当前仓库代码已包含上游模板的所有最新提交，无需更新！"
            exit 0
          fi

          echo "🚀 检测到上游模板有新更新，准备执行同步..."

          # 定义保护目录函数：保护 posts/ 与 public/images 不被上游覆盖或混入模板演示资源
          protect_directories() {
            echo "🛡️ 正在保护用户文章与静态资源目录（$PROTECTED_DIRS）..."
            for dir in $PROTECTED_DIRS; do
              dir="${dir%/}"
              [ -z "$dir" ] && continue
              # 若保护目录传入了 public 全目录，智能细化为 public/images，确保 public/js 与 public/css 能正常接收模板升级
              if [ "$dir" = "public" ]; then
                dir="public/images"
                echo "   💡 检测到传入了 public 全目录保护，已自动精细化为图库目录: public/images"
              fi
              if [ -n "$(git ls-tree HEAD "$dir" 2>/dev/null)" ]; then
                echo "   🔒 还原目录: $dir (保留本地 HEAD 状态)"
                git reset HEAD -- "$dir" 2>/dev/null || true
                git checkout HEAD -- "$dir" 2>/dev/null || true
                git clean -fd "$dir" 2>/dev/null || true
              else
                echo "   🧹 清理上游新增目录: $dir"
                git rm -rf --cached "$dir" 2>/dev/null || true
                rm -rf "$dir" 2>/dev/null || true
              fi
            done
            echo "✓ 已成功排除上游 [$PROTECTED_DIRS]，本地文章与自定义资源保持原样！"
          }

          # 5. 执行同步策略
          if [ "$SYNC_MODE" = "pr" ]; then
            SYNC_BRANCH="sync/template-$(date +%Y%m%d-%H%M%S)"
            echo "🔀 正在创建更新分支: $SYNC_BRANCH"
            git checkout -b "$SYNC_BRANCH"

            # 暂停自动提交，以便在合并时排除受保护的目录
            git merge --no-commit --no-ff --allow-unrelated-histories "template/$UPSTREAM_BRANCH" || true
            protect_directories

            # 检查是否有未解决的代码冲突
            UNRESOLVED=$(git diff --name-only --diff-filter=U)
            if [ -n "$UNRESOLVED" ]; then
              echo "⚠️ 核心代码存在合并冲突：$UNRESOLVED"
              echo "正在暂存并提交代码冲突标记到 $SYNC_BRANCH 分支..."
              git add .
              git commit -m "chore: sync updates from template $UPSTREAM_REPO (contains merge conflicts)"
              git push -u origin "$SYNC_BRANCH"
              echo "✓ 冲突已提交至 $SYNC_BRANCH，正在创建 Pull Request 供网页端解决冲突..."
              gh pr create --base "$CURRENT_BRANCH" --head "$SYNC_BRANCH" \
                --title "⚠️ [冲突需解决] 同步上游模板更新 ($UPSTREAM_REPO)" \
                --body "从上游模板 [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO) 同步代码时存在代码冲突（已自动保护并排除 $PROTECTED_DIRS 目录）。请在网页端点击 'Resolve conflicts' 按钮或在本地检出本分支解决冲突后合并。" || true
            else
              # 无代码冲突，检查是否有实际代码变更
              if git diff --cached --quiet; then
                echo "🎉 排除 $PROTECTED_DIRS 目录后，上游模板无其他代码变动，仓库已是最新状态！"
                exit 0
              fi
              echo "✓ 自动合并成功（无冲突），正在推送到远程并创建 PR..."
              git commit -m "chore: sync updates from template $UPSTREAM_REPO"
              git push -u origin "$SYNC_BRANCH"
              gh pr create --base "$CURRENT_BRANCH" --head "$SYNC_BRANCH" \
                --title "chore: sync updates from template ($UPSTREAM_REPO)" \
                --body "本 PR 自动从上游模板仓库 [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO) 同步了最新的框架代码、部署脚本与功能改进（已自动保护并排除 $PROTECTED_DIRS 目录）。" || true
            fi
          else
            # direct 模式（默认）：直接合并到当前目标主分支
            git merge --no-commit --no-ff --allow-unrelated-histories "template/$UPSTREAM_BRANCH" || true
            protect_directories

            # 检查是否有未解决的代码冲突
            UNRESOLVED=$(git diff --name-only --diff-filter=U)
            if [ -z "$UNRESOLVED" ]; then
              # 无代码冲突
              if git diff --cached --quiet; then
                echo "🎉 排除 $PROTECTED_DIRS 目录后，上游模板无其他代码变动，仓库已是最新状态！"
                git merge --abort 2>/dev/null || true
                exit 0
              fi

              echo "✅ 代码合并成功（无冲突）！准备提交并推送到 $CURRENT_BRANCH..."
              git commit -m "chore: sync updates from template $UPSTREAM_REPO"

              if git push origin "$CURRENT_BRANCH"; then
                echo "🎉 上游模板更新已成功合并并推送到 $CURRENT_BRANCH 分支！"
              else
                echo "⚠️ 推送至 $CURRENT_BRANCH 受阻（可能开启了保护分支规则），自动切换为创建 PR 分支..."
                SYNC_BRANCH="sync/template-$(date +%Y%m%d-%H%M%S)"
                git checkout -b "$SYNC_BRANCH"
                git push -u origin "$SYNC_BRANCH"
                gh pr create --base "$CURRENT_BRANCH" --head "$SYNC_BRANCH" \
                  --title "chore: sync updates from template ($UPSTREAM_REPO)" \
                  --body "上游模板 [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO) 代码已成功合并（已自动保护并排除 $PROTECTED_DIRS 目录）。因 $CURRENT_BRANCH 分支开启了保护规则，已自动转为 Pull Request 供审核合并。" || true
              fi
            else
              echo "⚠️ 检测到核心代码冲突：$UNRESOLVED"
              echo "自动取消当前分支合并，转为在独立分支中提交冲突并创建 PR，保护 $CURRENT_BRANCH 分支安全..."
              git merge --abort || true
              SYNC_BRANCH="sync/template-conflicts-$(date +%Y%m%d-%H%M%S)"
              git checkout -b "$SYNC_BRANCH"
              # 在独立分支上重新执行合并并保护目录
              git merge --no-commit --no-ff --allow-unrelated-histories "template/$UPSTREAM_BRANCH" || true
              protect_directories
              # 关键步骤：必须暂存并提交冲突内容，确保生成新 Commit，才能成功 push 并创建 PR
              git add .
              git commit -m "chore: sync updates from template $UPSTREAM_REPO (contains merge conflicts)"
              git push -u origin "$SYNC_BRANCH"
              echo "✓ 冲突已提交至 $SYNC_BRANCH 分支，正在创建 Pull Request 供网页端解决冲突..."
              gh pr create --base "$CURRENT_BRANCH" --head "$SYNC_BRANCH" \
                --title "⚠️ [冲突需解决] 同步上游模板更新 ($UPSTREAM_REPO)" \
                --body "从上游模板 [$UPSTREAM_REPO](https://github.com/$UPSTREAM_REPO) 同步代码时与本仓库已有文件产生冲突（已自动保护并排除 $PROTECTED_DIRS 目录）。请在网页端点击 'Resolve conflicts' 按钮或在本地检出分支解决冲突后合并。" || {
                  echo "💡 提示：若 PR 创建受限，可在本地运行以下命令拉取并解决冲突："
                  echo "   git checkout $SYNC_BRANCH"
                  echo "   git status"
                }
            fi
          fi
